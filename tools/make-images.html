<!doctype html>
<!--
  Draws the game's icon and link-preview picture with the game's own art.
  tools/make-images.sh opens this in headless Chrome and saves the PNGs into img/.
  #icon  = 512x512 app icon     #share = 1200x630 link preview
  (You can also open it in a browser to look: add #icon or #share to the address.)
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sloth Slap images</title>
  <style>html, body { margin: 0; overflow: hidden; background: #1b1430; } canvas { display: block; }</style>
</head>
<body>
  <canvas id="game"></canvas>
  <script src="../js/core/engine.js"></script>
  <script src="../js/core/input.js"></script>
  <script src="../js/core/touch.js"></script>
  <script src="../js/core/audio.js"></script>
  <script src="../js/core/fx.js"></script>
  <script src="../js/art/sloth.js"></script>
  <script src="../js/art/enemies.js"></script>
  <script src="../js/art/creatures2.js"></script>
  <script src="../js/art/creatures3.js"></script>
  <script src="../js/art/backgrounds.js"></script>
  <script src="../js/data/characters.js"></script>
  <script src="../js/scenes/ui.js"></script>
  <script>
    (function () {
      const cv = document.getElementById('game');
      const share = location.hash === '#share';
      const w = cv.width = share ? 1200 : 512, h = cv.height = share ? 630 : 512;
      const ctx = cv.getContext('2d');
      const UI = SS.UI, look = (id) => SS.charById(id).look;

      // The jungle backdrop (drawn at the game's 960x540), scaled to cover the picture.
      function backdrop(groundY, camX) {
        const s = Math.max(w / SS.W, h / SS.H);
        ctx.save();
        ctx.translate((w - SS.W * s) / 2, h - SS.H * s);
        ctx.scale(s, s);
        SS.Art.background(ctx, 'jungle', camX, 2, groundY);
        ctx.restore();
      }
      function burst(x, y, r, color, points) {
        ctx.fillStyle = color;
        ctx.beginPath();
        for (let i = 0; i < points * 2; i++) {
          const rad = i % 2 ? r * 0.62 : r, a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
          ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fill();
      }

      if (share) {
        backdrop(470, 140);
        ctx.fillStyle = 'rgba(27,20,48,0.25)';
        ctx.fillRect(0, 0, w, h);
        // two sloths trading slaps, like the title screen
        const gy = h - 40;
        SS.Art.shadow(ctx, 190, gy, 60);
        SS.Art.shadow(ctx, w - 190, gy, 60);
        burst(w - 215, gy - 255, 82, '#ffd23f', 12);
        SS.Art.sloth(ctx, { x: 190, y: gy, facing: 1, scale: 2.15, look: look('sir'), t: 0, arm: 0.3, pose: 'idle', slapping: true });
        SS.Art.sloth(ctx, { x: w - 190, y: gy, facing: -1, scale: 2.15, look: look('chonk'), t: 1, pose: 'hurt' });
        ctx.save();
        ctx.translate(w - 215, gy - 255);
        ctx.rotate(0.18);
        UI.outlineText(ctx, 'SLAP!', 0, 0, 44, '#ff4d6d', 'center');
        ctx.restore();
        // title
        ctx.save();
        ctx.translate(w / 2, 175);
        ctx.rotate(-0.03);
        UI.outlineText(ctx, 'THE', 0, -86, 44, '#ffffff', 'center');
        UI.outlineText(ctx, 'SLOTH SLAP', 0, 0, 122, '#ffd23f', 'center', '#2b193d');
        const half = ctx.measureText('SLOTH SLAP').width / 2;
        UI.outlineText(ctx, '™', half + 4, -42, 36, '#ffd23f', 'left');
        UI.outlineText(ctx, 'GAME', 0, 98, 68, '#ff4d6d', 'center');
        ctx.restore();
        UI.outlineText(ctx, 'Free to play in your browser, on phones too', w / 2, 400, 30, '#ffffff', 'center');
        UI.outlineText(ctx, '11 sloths  •  17 maps  •  boss battles  •  duels', w / 2, 446, 24, '#9bf6ff', 'center');
      } else {
        // app icon: one big sloth mid-slap with a comic burst
        backdrop(470, 60);
        burst(w * 0.8, h * 0.6, w * 0.2, '#ffd23f', 11);
        SS.Art.sloth(ctx, { x: w * 0.34, y: h * 1.16, facing: 1, scale: 3.6, look: look('sir'), t: 0, arm: 0.3, pose: 'idle', slapping: true });
      }
      // tools/make-images.sh reads the finished picture from here
      const out = document.createElement('pre');
      out.id = 'png';
      out.hidden = true;
      out.textContent = cv.toDataURL('image/png');
      document.body.appendChild(out);
    })();
  </script>
</body>
</html>
