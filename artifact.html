<title>The Sloth Slap Game</title>
<!--
  Web version of the game, published as a claude.ai artifact (page + the js/ files).
  Same game as index.html, minus Wi-Fi play (an artifact has no home relay server).
  Keep the <script> list identical to index.html - tools/run-tests.sh checks it.
-->
<style>
  /* Layout: one full-screen game canvas, letterboxed 16:9; the game draws its own touch buttons on top. */
  /* The game keeps one dark jungle-night look in every theme. */
  :root {
    color-scheme: dark;
    --bg: #1b1430;
    --shadow: rgba(0, 0, 0, 0.6);
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: fixed;          /* no page bounce / pull-to-refresh on phones */
    inset: 0;
    overscroll-behavior: none;
  }
  #touchLayer {
    position: fixed;
    left: 0;
    top: 0;
    pointer-events: none;
    z-index: 10;
  }
  canvas#game {
    display: block;
    max-width: 100%;
    box-shadow: 0 0 40px var(--shadow);
    outline: none;
  }
</style>

<canvas id="game" aria-label="The Sloth Slap Game"></canvas>
