<!doctype html>
<html lang="en">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="description" content="A comical cartoon sloth slap-'em-up. Free to play in your browser, on phones too: 11 sloths, 17 maps, boss battles and duels.">
  <!-- Icons (browser tab, phone home screen). Redraw them with tools/make-images.sh -->
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Sloth Slap™ Game">
  <meta property="og:title" content="The Sloth Slap™ Game">

  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Sloth Slap Game: two cartoon sloths trading slaps in a jungle">
